<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SikPoket — Unlock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css?v=2.0.1">
</head>
<body style="background:#FDFBF7;">
<div class="sp-shell" style="max-width: 420px; margin: 60px auto; min-height: auto; background:#FDFBF7;">
  <div class="sp-lock-card" style="display:block;">
    <div class="sp-lock-glow"></div>
    <div class="sp-lock-icon">
      <svg viewBox="0 0 40 40" fill="none" width="40">
        <rect x="8" y="20" width="24" height="16" rx="4" fill="#6c63f5" opacity=".18"/>
        <rect x="8" y="20" width="24" height="16" rx="4" stroke="#6c63f5" stroke-width="1.5"/>
        <path d="M14 20v-5a6 6 0 1112 0v5" stroke="#6c63f5" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="20" cy="28" r="2" fill="#6c63f5"/>
      </svg>
    </div>
    <h1 class="sp-lock-title">SikPoket</h1>
    <p class="sp-lock-sub" id="status">Tap below to unlock with Touch ID</p>
    <button id="unlock-btn" class="sp-lock-btn" style="margin-top:12px;">🔐 Unlock with Touch ID</button>
    <button id="register-btn" class="sp-lock-bio" style="margin-top:6px;">👆 Register Touch ID for This Device</button>
    <input type="password" id="master-pw-input" class="sp-lock-input" placeholder="Enter master password first" style="display:none;">
    <p class="sp-lock-hint" id="hint">No biometric set up? Use the extension popup normally first, then come back here.</p>
  </div>
</div>
<script src="crypto-helper.js"></script>
<script src="unlock.js"></script>
</body>
</html>
