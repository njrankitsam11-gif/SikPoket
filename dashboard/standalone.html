<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SikPoket</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
.login-card { width: 400px; background: var(--surface); border: 1px solid var(--outline); border-radius: 16px; padding: 40px 32px; text-align: center; margin: auto; }
.login-icon { font-size: 40px; margin-bottom: 12px; }
.login-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
.login-sub { font-size: 13px; color: var(--on-variant); margin-bottom: 28px; }
.tab-switch { display: flex; background: #0f1015; border: 1px solid var(--outline); border-radius: 12px; margin-bottom: 24px; overflow: hidden; }
.tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--on-variant); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
.tab-btn.active { background: var(--primary); color: #fff; }
.btn-primary { width:100%;padding:12px;margin-top:8px;background:var(--primary);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all 0.15s;}
.btn-primary:hover { background: #7888f4; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.error-msg { color: #e05353; font-size: 12px; margin-top: 10px; min-height: 18px; }
.success-msg { color: #5dcaa5; }
/* ============================================================
   SikPoket Dashboard — Markmez-inspired + Spaces
   Multiple workspaces with custom wallpapers.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:         #0c0e12;
  --surface:    #1b1d23;
  --surface-2:  #20232b;
  --primary:    #6b7cf0;
  --primary-2:  #5a6ad8;
  --brand-soft: #9fb0ff;
  --green:      #5dcaa5;
  --on-surface: #f4f6fb;
  --on-variant: #8b93a7;
  --muted:      #5b6377;
  --outline:    rgba(255, 255, 255, 0.08);
  --outline-hover: rgba(255, 255, 255, 0.14);
  --divider:    rgba(255, 255, 255, 0.07);
  --danger:     #e05353;
  --warning:    #f0b429;
  --success:    #4caf84;

  --r-sm: 0.5rem;
  --r-md: 0.75rem;
  --r-lg: 1rem;

  --font: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
  --sidebar-w: 230px;
}

html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--on-surface);
  font-size: 13px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.app { display: flex; height: 100vh; overflow: hidden; position: relative; }

/* ── WALLPAPER OVERLAY ────────────────── */
.wallpaper-bg {
  position: fixed; inset: 0; z-index: 0;
  background-size: cover; background-position: center;
  background-repeat: no-repeat;
  opacity: 0.15; transition: background-image 0.6s ease, opacity 0.6s ease;
  pointer-events: none;
}

/* ── SIDEBAR ─────────────────────────── */
.sidebar {
  width: var(--sidebar-w); background: rgba(27,29,35,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-right: 1px solid var(--divider);
  display: flex; flex-direction: column; flex-shrink: 0;
  transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
  z-index: 10; position: relative;
}
.sidebar.collapsed {
  transform: translateX(calc(-1 * var(--sidebar-w)));
  position: absolute; height: 100%;
}

.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 16px 16px; border-bottom: 1px solid var(--divider); flex-shrink: 0;
}
.brand-icon { font-size: 20px; }
.brand-name { font-size: 16px; font-weight: 700; color: var(--on-surface); letter-spacing: -0.01em; }

/* ── SPACE SWITCHER ─────────────────── */
.space-switcher {
  padding: 10px 14px 6px; flex-shrink: 0;
}
.space-list { display: flex; flex-direction: column; gap: 2px; }
.space-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 8px 10px;
  background: transparent; border: none; border-radius: var(--r-md);
  color: var(--on-variant); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; text-align: left;
  font-family: var(--font);
}
.space-item:hover { background: var(--surface-2); color: var(--on-surface); }
.space-item.active { background: rgba(107,124,240,0.12); color: var(--brand-soft); font-weight: 600; }
.space-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--primary);
}
.space-count { margin-left: auto; font-size: 10px; color: var(--muted); }
.space-item.active .space-count { color: var(--brand-soft); }

.add-space-btn {
  display: flex; align-items: center; gap: 6px;
  width: 100%; padding: 6px 10px; margin-top: 4px;
  background: transparent; border: 1px dashed var(--outline);
  border-radius: var(--r-md); color: var(--muted); font-size: 11px;
  cursor: pointer; font-family: var(--font); transition: all 0.15s;
}
.add-space-btn:hover { border-color: var(--primary); color: var(--brand-soft); background: rgba(107,124,240,0.04); }

/* Wallpaper button inside space */
.space-wallpaper-btn {
  margin-left: auto; background: transparent; border: none; color: var(--muted);
  cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 4px;
  opacity: 0; transition: all 0.15s;
}
.space-item:hover .space-wallpaper-btn { opacity: 1; }
.space-wallpaper-btn:hover { color: var(--brand-soft); background: rgba(107,124,240,0.1); }

.sidebar-search { padding: 10px 14px 8px; flex-shrink: 0; }
.sidebar-search-inner {
  display: flex; align-items: center;
  background: var(--surface-2); border: 1px solid var(--outline);
  border-radius: var(--r-md); padding: 0 10px; gap: 8px; transition: border-color 0.15s;
}
.sidebar-search-inner:focus-within { border-color: var(--primary); }
.search-icon-svg { width: 14px; color: var(--muted); flex-shrink: 0; }
#global-search {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--on-surface); font-size: 12px; padding: 9px 0; font-family: var(--font);
}
#global-search::placeholder { color: var(--muted); }

.sidebar-nav { flex: 1; padding: 8px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.nav-section-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); padding: 8px 10px 6px;
}
.nav-item, .sidebar-tag-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 7px 10px;
  background: transparent; border: none; border-radius: var(--r-md);
  color: var(--on-variant); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; text-align: left; font-family: var(--font);
}
.nav-item:hover, .sidebar-tag-btn:hover { background: var(--surface-2); color: var(--on-surface); }
.nav-item.active, .sidebar-tag-btn.active { background: rgba(107,124,240,0.12); color: var(--brand-soft); font-weight: 600; }
.nav-icon-svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.7; }
.nav-item.active .nav-icon-svg { opacity: 1; }
.nav-badge { margin-left: auto; font-size: 10px; background: var(--surface-2); color: var(--muted); padding: 1px 7px; border-radius: 10px; min-width: 20px; text-align: center; }
.nav-item.active .nav-badge { background: rgba(107,124,240,0.2); color: var(--brand-soft); }
.sidebar-tag-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
.sidebar-tag-count { margin-left: auto; font-size: 10px; color: var(--muted); }

.sidebar-footer {
  display: flex; gap: 6px; padding: 10px 14px;
  border-top: 1px solid var(--divider); flex-shrink: 0;
}
.sidebar-footer-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 7px 10px; background: var(--surface-2); border: 1px solid var(--outline);
  border-radius: var(--r-md); color: var(--on-variant); font-size: 11px;
  font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: var(--font);
}
.sidebar-footer-btn:hover { background: #262932; color: var(--on-surface); border-color: var(--outline-hover); }

/* ── MAIN ────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; position: relative; z-index: 1; }

.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 22px; background: rgba(27,29,35,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--divider); flex-shrink: 0; gap: 12px;
}
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sidebar-toggle {
  background: transparent; border: none; color: var(--muted);
  cursor: pointer; padding: 5px; border-radius: 6px; display: flex; transition: all 0.15s;
}
.sidebar-toggle:hover { color: var(--on-surface); background: var(--surface-2); }
.topbar h1 { font-size: 17px; font-weight: 600; color: var(--on-surface); white-space: nowrap; letter-spacing: -0.01em; }
.view-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.topbar-select {
  padding: 6px 12px; background: var(--surface-2); border: 1px solid var(--outline);
  border-radius: var(--r-md); color: var(--on-variant); font-size: 11px;
  font-family: var(--font); cursor: pointer; appearance: none; -webkit-appearance: none;
}
.topbar-select:focus { outline: none; border-color: var(--primary); }
.view-toggle { display: flex; background: var(--surface-2); border: 1px solid var(--outline); border-radius: var(--r-md); overflow: hidden; }
.view-toggle-btn { background: transparent; border: none; color: var(--muted); padding: 6px 9px; cursor: pointer; display: flex; align-items: center; transition: all 0.15s; }
.view-toggle-btn:hover { color: var(--on-variant); }
.view-toggle-btn.active { background: rgba(107,124,240,0.15); color: var(--brand-soft); }
.add-btn-topbar {
  display: flex; align-items: center; gap: 5px; padding: 7px 16px;
  background: var(--primary); border: none; border-radius: 999px;
  color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: background 0.2s, transform 0.1s; font-family: var(--font); letter-spacing: 0.01em;
}
.add-btn-topbar:hover { background: #7888f4; transform: translateY(-1px); }
.tag-strip {
  display: flex; align-items: center; gap: 8px; padding: 8px 22px;
  background: rgba(107,124,240,0.06); border-bottom: 1px solid rgba(107,124,240,0.12);
  flex-shrink: 0; font-size: 12px;
}
.tag-strip.hidden { display: none; }
.tag-strip-label { color: var(--muted); }
.tag-strip-value { color: var(--brand-soft); font-weight: 600; }
.tag-strip-clear { margin-left: auto; background: transparent; border: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 3px 8px; border-radius: 6px; transition: all 0.15s; font-family: var(--font); }
.tag-strip-clear:hover { color: var(--danger); background: rgba(224,83,83,0.08); }

/* ── CONTENT ─────────────────────────── */
.content { flex: 1; overflow-y: auto; padding: 24px; position: relative; z-index: 1; }
.items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.items-list { display: flex; flex-direction: column; gap: 6px; }

/* ── CARD ────────────────────────────── */
.item-card {
  background: rgba(27, 29, 35, 0.88); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--outline); border-radius: var(--r-lg);
  overflow: hidden; transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  animation: cardIn 0.2s ease;
}
.item-card:hover {
  border-color: var(--outline-hover); background: rgba(32,35,43,0.92);
  transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.item-card[data-type="url"]      { border-left: 3px solid var(--primary); }
.item-card[data-type="note"]     { border-left: 3px solid var(--green); }
.item-card[data-type="key"]      { border-left: 3px solid var(--warning); }
.item-card[data-type="password"] { border-left: 3px solid var(--danger); }
.card-body { padding: 14px 14px 10px; }
.card-color-bar { display: none; }
.card-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.card-favicon { width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; overflow: hidden; border: 1px solid var(--outline); }
.card-favicon img { width: 20px; height: 20px; object-fit: contain; border-radius: 3px; }
.card-favicon-placeholder { font-size: 15px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; text-decoration: none; display: block; transition: color 0.12s; }
a.card-title:hover { color: var(--brand-soft); }
.card-domain { font-size: 10px; color: var(--muted); display: block; margin-top: 1px; }
.card-excerpt { font-size: 11px; color: var(--on-variant); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 6px; }
.card-secret {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface-2); border: 1px solid var(--outline); border-radius: 6px;
  padding: 3px 9px; font-size: 11px; color: var(--brand-soft);
  cursor: pointer; font-family: 'SF Mono', monospace; letter-spacing: 0.04em; transition: all 0.15s; margin-bottom: 4px;
}
.card-secret:hover { background: var(--primary); border-color: var(--primary); color: #fff; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.card-tag { background: rgba(107,124,240,0.1); color: var(--brand-soft); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 500; cursor: pointer; border: 1px solid rgba(107,124,240,0.18); transition: all 0.12s; }
.card-tag:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.card-footer { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px 10px; opacity: 0; transition: opacity 0.15s; }
.item-card:hover .card-footer { opacity: 1; }
.card-date { font-size: 10px; color: var(--muted); }
.card-actions { display: flex; gap: 2px; }
.card-action-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 3px 5px; border-radius: 5px; font-size: 12px; transition: all 0.12s; }
.card-action-btn:hover { background: var(--surface-2); color: var(--on-surface); }
.card-action-btn.fav-active {  color: var(--warning); }
.card-action-btn.delete-btn:hover { background: rgba(224,83,83,0.1); color: var(--danger); }

/* List mode */
.item-card.list-mode { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm); }
.item-card.list-mode:hover { transform: translateX(3px); }
.item-card.list-mode .card-body { padding: 0; flex: 1; min-width: 0; }
.item-card.list-mode .card-title-row { margin-bottom: 2px; }
.item-card.list-mode .card-excerpt { display: none; }
.item-card.list-mode .card-tags { margin-top: 3px; }
.item-card.list-mode .card-footer { border-top: none; padding: 0; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0; opacity: 0; }
.item-card.list-mode:hover .card-footer { opacity: 1; }
.item-card.list-mode .card-favicon { width: 26px; height: 26px; }

/* ── EMPTY STATE ─────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 24px;
  color: var(--muted); text-align: center; min-height: 300px;
}
.empty-icon { font-size: 48px; margin-bottom: 18px; opacity: 0.4; }
.empty-title { font-size: 17px; font-weight: 600; color: var(--on-variant); margin-bottom: 8px; }
.empty-desc { font-size: 13px; line-height: 1.5; max-width: 300px; }

/* ── MODAL ───────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 20px; }
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface); border: 1px solid var(--outline-hover); border-radius: var(--r-lg);
  width: 480px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5); animation: modalIn 0.22s cubic-bezier(0.16,1,0.3,1);
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--divider); }
.modal-header h3 { font-size: 16px; font-weight: 600; color: var(--on-surface); }
.modal-close { background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 6px; border-radius: 5px; transition: all 0.15s; }
.modal-close:hover { color: var(--on-surface); background: var(--surface-2); }
.modal-type-pills { display: flex; gap: 6px; padding: 14px 22px; border-bottom: 1px solid var(--divider); flex-wrap: wrap; }
.type-pill {
  padding: 6px 14px; border: 1px solid var(--outline); border-radius: 999px;
  background: transparent; color: var(--on-variant); font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: var(--font); transition: all 0.15s;
}
.type-pill:hover { background: var(--surface-2); color: var(--on-surface); border-color: var(--outline-hover); }
.type-pill.active { background: rgba(107,124,240,0.12); border-color: var(--primary); color: var(--brand-soft); font-weight: 600; }
.modal-body { padding: 18px 22px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.form-group input, .form-group textarea {
  width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--outline); border-radius: var(--r-md);
  color: var(--on-surface); font-size: 13px; font-family: var(--font); transition: border-color 0.2s;
}
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
.form-group input::placeholder, .form-group textarea::placeholder { color: var(--muted); }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group.hidden { display: none; }
.form-actions-modal { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
.btn-cancel { padding: 9px 20px; background: var(--surface-2); border: 1px solid var(--outline); border-radius: 999px; color: var(--on-variant); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
.btn-cancel:hover { background: #262932; color: var(--on-surface); border-color: var(--outline-hover); }
.btn-save { padding: 9px 24px; background: var(--primary); border: none; border-radius: 999px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: all 0.15s; letter-spacing: 0.01em; }
.btn-save:hover { background: #7888f4; transform: translateY(-1px); }

/* ── TOAST ───────────────────────────── */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--surface); border: 1px solid var(--outline-hover); border-radius: 999px; padding: 10px 22px; font-size: 13px; color: var(--on-surface); box-shadow: 0 12px 40px rgba(0,0,0,0.5); z-index: 2000; opacity: 0; transition: all 0.25s cubic-bezier(0.16,1,0.3,1); white-space: nowrap; font-weight: 500; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.hidden { display: none; }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error   { border-color: var(--danger); color: var(--danger); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--outline-hover); border-radius: 3px; }

@media (max-width: 860px) { :root { --sidebar-w: 200px; } .items-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }
@media (max-width: 640px) { .sidebar { position: absolute; height: 100%; z-index: 20; } .items-grid { grid-template-columns: 1fr; } .topbar h1 { font-size: 14px; } }</style>
</head>
<body>
<div id="auth-screen" style="display:none;font-family:var(--font);position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;z-index:9999;">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h1 class="login-title">SikPoket</h1>
    <p class="login-sub">Secure vault — login or create account</p>
    <div class="tab-switch">
      <button class="tab-btn active" data-mode="login">Login</button>
      <button class="tab-btn" data-mode="register">Register</button>
    </div>
    <form id="auth-form">
      <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="your-username" required autofocus></div>
      <div class="form-group"><label>Master Password</label><input type="password" id="password" placeholder="Your secret password" required></div>
      <div class="form-group" id="confirm-group" style="display:none;"><label>Confirm Password</label><input type="password" id="confirm-password" placeholder="Type it again"></div>
      <button type="submit" class="btn-primary" id="submit-btn">Login</button>
      <div class="error-msg" id="msg"></div>
    </form>
  </div>

<script>

let authMode = 'login';
function sha256(s) { return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("")); }
function genSalt() { return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2,"0")).join(""); }
async function hashPw(p, s) { return sha256(p + s); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function getDb() { try { return JSON.parse(localStorage.getItem("***")) || {}; } catch(e) { return {}; } }

function showAuthScreen() {
  var a = document.getElementById("auth-screen"), d = document.getElementById("app");
  if (a) a.style.display = "flex"; if (d) d.style.display = "none";
  document.querySelectorAll(".tab-btn").forEach(function(b) {
    b.addEventListener("click", function() {
      document.querySelectorAll(".tab-btn").forEach(function(x) { x.classList.remove("active"); });
      b.classList.add("active"); authMode = b.dataset.mode;
      document.getElementById("confirm-group").style.display = authMode === "register" ? "block" : "none";
      document.getElementById("submit-btn").textContent = authMode === "login" ? "Login" : "Create Account";
    });
  });
  document.getElementById("auth-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    var u = document.getElementById("username").value.trim().toLowerCase(), p = document.getElementById("password").value;
    if (!u || !p) return;
    var btn = document.getElementById("submit-btn"); btn.disabled = true;
    if (authMode === "register") {
      if (p !== document.getElementById("confirm-password").value) {
        document.getElementById("msg").textContent = "Passwords do not match"; btn.disabled = false; return;
      }
      await doRegister(u, p);
    } else { await doLogin(u, p); }
  });
}

async function doRegister(user, pass) {
  var db = getDb();
  if (db[user]) { document.getElementById("msg").textContent = "Username taken"; return; }
  var salt = genSalt(), hash = await hashPw(pass, salt);
  db[user] = { hash: hash, salt: salt, createdAt: Date.now() };
  localStorage.setItem("***", JSON.stringify(db));
  seedUserData(user);
  document.getElementById("msg").style.color = "#5dcaa5";
  document.getElementById("msg").textContent = "Account created!";
  setTimeout(function() { sessionStorage.setItem("sikpoket_user", user); location.reload(); }, 600);
}

async function doLogin(user, pass) {
  var db = getDb(), u = db[user];
  if (!u) { document.getElementById("msg").textContent = "User not found"; return; }
  var hash = await hashPw(pass, u.salt);
  if (hash !== u.hash) { document.getElementById("msg").textContent = "Wrong password"; return; }
  document.getElementById("msg").style.color = "#5dcaa5";
  document.getElementById("msg").textContent = "Welcome!";
  setTimeout(function() { sessionStorage.setItem("sikpoket_user", user); location.reload(); }, 300);
}

function seedUserData(user) {
  var key = "sikpoket_" + user;
  if (localStorage.getItem(key)) return;
  var s1 = genId(), s2 = genId(), s3 = genId();
  localStorage.setItem(key, JSON.stringify({
    spaces: [
      { id: s1, name: "Startups", wallpaper: "https://images.unsplash.com/photo-1559136555-9303baea8ebd?w=1200&q=80",
        items: [
          { id: genId(), type: "url", createdAt: Date.now()-432000000, title: "Raindrop.io", url: "https://raindrop.io", tags: ["tools"], favorite: true, archived: false },
        ]},
      { id: s2, name: "Research", wallpaper: "https://images.unsplash.com/photo-1507693769325-4b6d49b0ba76?w=1200&q=80",
        items: [
          { id: genId(), type: "url", createdAt: Date.now()-36000000, title: "arXiv", url: "https://arxiv.org/list/cs.LG/recent", tags: ["ai"], favorite: false, archived: false },
        ]},
      { id: s3, name: "Personal", wallpaper: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80",
        items: [
          { id: genId(), type: "url", createdAt: Date.now(), title: "Netflix", url: "https://netflix.com", tags: [], favorite: false, archived: false },
        ]}
    ],
    activeSpace: s1
  }));
}

(function() {
  var u = sessionStorage.getItem("sikpoket_user");
  if (!u) { showAuthScreen(); }
})();

</script>
<script>
/* =====================================================
   SikPoket Dashboard — Spaces + Wallpapers
   ===================================================== */

// Use user-scoped storage key + add logout 
const CURRENT_USER = sessionStorage.getItem('sikpoket_user') || 'guest';
const STORAGE_KEY = 'sikpoket_' + CURRENT_USER;
const TYPE_META = {
  url:{icon:'🔗',label:'URL',placeholder:'🔗'},
  note:{icon:'📝',label:'Note',placeholder:'📝'},
  key:{icon:'🔑',label:'API Key',placeholder:'🔑'},
  password:{icon:'🔒',label:'Password',placeholder:'🔒'}
};

let state = {
  spaces: [],       // [{id, name, wallpaper, items}]
  activeSpace: null, // space id
  collection: 'all',
  tag: null,
  search: '',
  sort: 'newest',
  viewMode: 'grid',
  editId: null
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : null;
    if (data && data.spaces) {
      state.spaces = data.spaces.map(s => ({ wallpaper: '', ...s, items: (s.items||[]).filter(i => !i._removed) }));
      state.activeSpace = data.activeSpace || (state.spaces[0]?.id || null);
    } else if (data && Array.isArray(data)) {
      // migrate old flat items format
      state.spaces = [{ id: genId(), name: 'Default', wallpaper: '', items: data }];
      state.activeSpace = state.spaces[0].id;
    }
  } catch { state.spaces = []; state.activeSpace = null; }

  if (!state.spaces.length) {
    const id = genId();
    state.spaces = [{ id, name: 'Default', wallpaper: '', items: [] }];
    state.activeSpace = id;
  }
  if (typeof chrome !== 'undefined' && chrome.storage) {
    chrome.storage.local.get(['sikpoketDashboardData'], (r) => {
      if (r.sikpoketDashboardData?.length) {
        const space = getActiveSpace(); if (space) space.items = [...r.sikpoketDashboardData, ...space.items];
        chrome.storage.local.remove('sikpoketDashboardData');
        save(); render(); updateBadges(); renderSidebarTags();
      }
    });
  }
}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ spaces: state.spaces, activeSpace: state.activeSpace })); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function getActiveSpace() { return state.spaces.find(s => s.id === state.activeSpace) || state.spaces[0]; }
function setWallpaper() {
  const el = document.getElementById('wallpaper-bg');
  const space = getActiveSpace();
  if (el && space?.wallpaper) { el.style.backgroundImage = `url(${space.wallpaper})`; el.style.opacity = '0.15'; }
  else if (el) { el.style.backgroundImage = ''; el.style.opacity = '0'; }
}

function getFiltered() {
  const space = getActiveSpace(); if (!space) return [];
  let items = [...space.items];
  if (state.collection === 'favorites') items = items.filter(i => i.favorite && !i.archived);
  else if (state.collection === 'archived') items = items.filter(i => i.archived);
  else if (['urls','notes','keys','passwords'].includes(state.collection)) {
    const m = { urls:'url', notes:'note', keys:'key', passwords:'password' };
    items = items.filter(i => i.type === m[state.collection] && !i.archived);
  } else items = items.filter(i => !i.archived);
  if (state.tag) items = items.filter(i => i.tags && i.tags.includes(state.tag));
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    items = items.filter(i => (i.title||'').toLowerCase().includes(q) || (i.url||'').toLowerCase().includes(q) || (i.name||'').toLowerCase().includes(q) || (i.content||'').toLowerCase().includes(q) || (i.tags||[]).some(t=>t.toLowerCase().includes(q)));
  }
  if (state.sort === 'newest') items.sort((a,b)=>b.createdAt-a.createdAt);
  else if (state.sort === 'oldest') items.sort((a,b)=>a.createdAt-b.createdAt);
  else if (state.sort === 'name') items.sort((a,b)=>(a.title||a.name||'').localeCompare(b.title||b.name||''));
  return items;
}

function updateBadges() {
  const space = getActiveSpace(); if (!space) return;
  const a = space.items.filter(i => !i.archived);
  document.getElementById('badge-all')?.textContent || setBdg('badge-all', a.length);
  setBdg('badge-favorites', a.filter(i=>i.favorite).length);
  setBdg('badge-archived', space.items.filter(i=>i.archived).length);
  setBdg('badge-urls', a.filter(i=>i.type==='url').length);
  setBdg('badge-notes', a.filter(i=>i.type==='note').length);
  setBdg('badge-keys', a.filter(i=>i.type==='key').length);
  setBdg('badge-passwords', a.filter(i=>i.type==='password').length);
  renderSidebarTags();
}
function setBdg(id, n) { const e = document.getElementById(id); if(e) e.textContent = n; }

function updateSpaceList() {
  const c = document.getElementById('space-list'); if (!c) return;
  c.innerHTML = state.spaces.map(s => `<button class="space-item ${s.id===state.activeSpace?'active':''}" data-space="${s.id}"><span class="space-dot"></span><span>${esc(s.name)}</span><span class="space-count">${(s.items||[]).filter(i=>!i.archived).length}</span><button class="space-wallpaper-btn" onclick="event.stopPropagation();openSpaceSettings('${s.id}')" title="Change wallpaper">🖼</button></button>`).join('');
  c.querySelectorAll('.space-item').forEach(b => b.addEventListener('click', () => {
    state.activeSpace = b.dataset.space; state.collection = 'all'; state.tag = null; updateTagStrip();
    save(); setWallpaper(); render(); updateSpaceList(); updateBadges();
  }));
}

function renderSidebarTags() {
  const c = document.getElementById('sidebar-tags'); if (!c) return;
  const space = getActiveSpace(); if (!space) return;
  const t = {}; space.items.filter(i=>!i.archived).forEach(i=>(i.tags||[]).forEach(tg=>t[tg]=(t[tg]||0)+1));
  const tags = Object.entries(t).sort((a,b)=>b[1]-a[1]);
  if (!tags.length) { c.innerHTML = '<div style="padding:6px 10px;font-size:11px;color:var(--muted);">No tags yet</div>'; return; }
  c.innerHTML = tags.map(([tag,n]) => `<button class="sidebar-tag-btn ${state.tag===tag?'active':''}" data-tag="${esc(tag)}"><span class="sidebar-tag-dot"></span><span>${esc(tag)}</span><span class="sidebar-tag-count">${n}</span></button>`).join('');
  c.querySelectorAll('.sidebar-tag-btn').forEach(b => b.addEventListener('click', () => { state.tag = state.tag===b.dataset.tag?null:b.dataset.tag; updateTagStrip(); render(); }));
}
const updateSidebarTags = renderSidebarTags;

function updateTagStrip() {
  const s = document.getElementById('tag-strip'), v = document.getElementById('tag-strip-value');
  if (state.tag) { s.classList.remove('hidden'); if(v) v.textContent = state.tag; } else s.classList.add('hidden');
}

function getFaviconUrl(url) { try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`; } catch { return null; } }

function faviconEl(item) {
  const m = TYPE_META[item.type]||TYPE_META.url;
  if (item.type==='url'&&item.url) {
    const s = getFaviconUrl(item.url);
    if (s) return `<div class="card-favicon"><img src="${esc(s)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<span class=card-favicon-placeholder>${m.placeholder}</span>'"></div>`;
  }
  return `<div class="card-favicon"><span class="card-favicon-placeholder">${m.icon}</span></div>`;
}

function cardHtml(item, lm) {
  const date = new Date(item.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
  let th = item.type==='url'&&item.url ? `<a class="card-title" href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title||item.url)}</a>` : `<span class="card-title">${esc(item.title||item.name||'Untitled')}</span>`;
  let dh = ''; if(item.type==='url'&&item.url) try{dh=`<span class="card-domain">${new URL(item.url).hostname}</span>`}catch{} else if((item.type==='key'||item.type==='password')&&item.username)dh=`<span class="card-domain">${esc(item.username)}</span>`;
  let bh = ''; if(item.type==='note'&&item.content)bh=`<div class="card-excerpt">${esc(item.content)}</div>`; else if((item.type==='key'||item.type==='password')&&item.value)bh=`<div class="card-secret" data-id="${item.id}" onclick="copySecret('${item.id}')">🔒 <span>${'•'.repeat(Math.min(item.value.length,14))}</span></div>`;
  const thtml = (item.tags||[]).length?`<div class="card-tags">${item.tags.map(t=>`<span class="card-tag" onclick="filterTag('${esc(t)}')">${esc(t)}</span>`).join('')}</div>`:'';
  return `<div class="item-card ${lm?'list-mode':''}" data-id="${item.id}"><div class="card-body"><div class="card-title-row">${faviconEl(item)}<div class="card-title-block">${th}${dh}</div></div>${bh}${thtml}</div><div class="card-footer"><span class="card-date">${date}</span><div class="card-actions"><button class="card-action-btn${item.favorite?' fav-active':''}" onclick="toggleFav('${item.id}')">${item.favorite?'★':'☆'}</button><button class="card-action-btn" onclick="toggleArchive('${item.id}')">${item.archived?'📤':'📥'}</button><button class="card-action-btn" onclick="openEdit('${item.id}')">✏️</button><button class="card-action-btn delete-btn" onclick="confirmDelete('${item.id}')">✕</button></div></div></div>`;
}

function render() {
  const a = document.getElementById('content-area'), vt = document.getElementById('view-title'), vc = document.getElementById('view-count');
  if (!a) return; const space = getActiveSpace(); if (!space) return;
  const items = getFiltered(), lm = state.viewMode==='list';
  const titles = {all:'All Items',favorites:'Favorites',archived:'Archive',urls:'URLs',notes:'Notes',keys:'API Keys',passwords:'Passwords'};
  if(vt) vt.textContent = state.tag?`#${state.tag}`:(titles[state.collection]||'All Items');
  if(vc) vc.textContent = `${items.length} item${items.length!==1?'s':''}`;
  if(!items.length) { a.innerHTML = `<div class="empty-state"><div class="empty-icon">${state.search?'🔍':'🗂️'}</div><div class="empty-title">${state.search?'No results':'Nothing here yet'}</div><div class="empty-desc">${state.search?`Nothing matches "${esc(state.search)}"`:'Add your first item with + Add above.'}</div></div>`; return; }
  a.innerHTML = `<div class="${lm?'items-list':'items-grid'}">${items.map(i=>cardHtml(i,lm)).join('')}</div>`;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.collection===state.collection));
  updateSidebarTags(); updateBadges(); setWallpaper();
}

window.toggleFav = id => { const s=getActiveSpace(); if(!s)return; const i=s.items.find(x=>x.id===id); if(i){i.favorite=!i.favorite;save();render();}};
window.toggleArchive = id => { const s=getActiveSpace(); if(!s)return; const i=s.items.find(x=>x.id===id); if(i){i.archived=!i.archived;save();render();toast(i.archived?'Archived':'Restored','success');}};
window.confirmDelete = id => { const s=getActiveSpace(); if(!s)return; const i=s.items.find(x=>x.id===id); if(!i)return; if(confirm(`Delete "${i.title||i.name}"?`)){s.items=s.items.filter(x=>x.id!==id);save();render();toast('Deleted','error');}};
window.copySecret = id => { const s=getActiveSpace(); if(!s)return; const i=s.items.find(x=>x.id===id); if(!i||!i.value)return; navigator.clipboard.writeText(i.value).then(()=>toast('Copied!','success')).catch(()=>toast('Copy failed','error'));};
window.filterTag = t => { state.tag=state.tag===t?null:t; updateTagStrip(); render(); };

function openAdd() {
  state.editId=null; document.getElementById('item-id').value=''; document.getElementById('item-form').reset();
  document.getElementById('item-type').value='url'; document.getElementById('modal-title').textContent='Add Item';
  document.getElementById('modal-type-pills').style.display='flex';
  document.querySelectorAll('.type-pill').forEach(p=>p.classList.remove('active'));
  document.querySelector('.type-pill[data-type="url"]').classList.add('active');
  showTypeFields('url'); document.getElementById('item-modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('form-url')?.focus(),100);
}
window.openEdit = id => { const s=getActiveSpace(); if(!s)return; const i=s.items.find(x=>x.id===id); if(!i)return; state.editId=id;
  document.getElementById('modal-title').textContent='Edit Item'; document.getElementById('modal-type-pills').style.display='none';
  document.getElementById('item-id').value=id; document.getElementById('item-type').value=i.type; showTypeFields(i.type);
  if(i.type==='url'){document.getElementById('form-url').value=i.url||'';document.getElementById('form-title').value=i.title||'';}
  else if(i.type==='note'){document.getElementById('form-title').value=i.title||'';document.getElementById('form-content').value=i.content||'';}
  else if(i.type==='key'){document.getElementById('form-name').value=i.name||'';document.getElementById('form-value').value=i.value||'';}
  else if(i.type==='password'){document.getElementById('form-name').value=i.name||'';document.getElementById('form-username').value=i.username||'';document.getElementById('form-value').value=i.value||'';}
  document.getElementById('form-tags').value=(i.tags||[]).join(', '); document.getElementById('item-modal').classList.remove('hidden');
};
function closeModal() { document.getElementById('item-modal').classList.add('hidden'); state.editId=null; }
function showTypeFields(type) {
  ['url','name','title','username','value','content'].forEach(f=>document.getElementById(`field-${f}`)?.classList.add('hidden'));
  if(type==='url')['url','title'].forEach(f=>document.getElementById(`field-${f}`)?.classList.remove('hidden'));
  else if(type==='note')['title','content'].forEach(f=>document.getElementById(`field-${f}`)?.classList.remove('hidden'));
  else if(type==='key')['name','value'].forEach(f=>document.getElementById(`field-${f}`)?.classList.remove('hidden'));
  else if(type==='password')['name','username','value'].forEach(f=>document.getElementById(`field-${f}`)?.classList.remove('hidden'));
}
function handleFormSubmit(e) {
  e.preventDefault(); const s=getActiveSpace(); if(!s)return;
  const type=document.getElementById('item-type').value;
  const tags=document.getElementById('form-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  let i = state.editId?s.items.find(x=>x.id===state.editId):null;
  if(!i){i={id:genId(),type,createdAt:Date.now(),favorite:false,archived:false};s.items.unshift(i);}
  i.tags=tags;i.type=type;
  if(type==='url'){i.url=document.getElementById('form-url').value.trim();i.title=document.getElementById('form-title').value.trim()||i.url;}
  else if(type==='note'){i.title=document.getElementById('form-title').value.trim()||'Untitled Note';i.content=document.getElementById('form-content').value.trim();}
  else if(type==='key'){i.name=document.getElementById('form-name').value.trim();i.value=document.getElementById('form-value').value.trim();}
  else if(type==='password'){i.name=document.getElementById('form-name').value.trim();i.username=document.getElementById('form-username').value.trim();i.value=document.getElementById('form-value').value.trim();}
  save();closeModal();render();toast(state.editId?'Updated!':'Saved!','success');
}

/* ── SPACES ─────────────────────────── */

window.openSpaceSettings = function(id) {
  const space = state.spaces.find(s=>s.id===id); if(!space)return;
  document.getElementById('space-edit-id').value = id;
  document.getElementById('space-name').value = space.name;
  document.getElementById('space-wallpaper').value = space.wallpaper || '';
  document.getElementById('space-modal-title').textContent = 'Edit Space';
  document.getElementById('space-modal').classList.remove('hidden');
  document.getElementById('space-name').focus();
};

function openAddSpace() {
  document.getElementById('space-edit-id').value ='';
  document.getElementById('space-name').value='';
  document.getElementById('space-wallpaper').value='';
  document.getElementById('space-form').reset();
  document.getElementById('space-modal-title').textContent='New Space';
  document.getElementById('space-modal').classList.remove('hidden');
  document.getElementById('space-name').focus();
}

window.handleSpaceSubmit = function(e) {
  e.preventDefault();
  const name = document.getElementById('space-name').value.trim();
  if (!name) return;
  const wallpaper = document.getElementById('space-wallpaper').value.trim();
  const editId = document.getElementById('space-edit-id').value;

  if (editId) {
    const s = state.spaces.find(x=>x.id===editId);
    if (s) { s.name = name; s.wallpaper = wallpaper; }
  } else {
    const ns = { id: genId(), name, wallpaper, items: [] };
    state.spaces.push(ns);
    state.activeSpace = ns.id;
  }
  save(); updateSpaceList(); setWallpaper(); render(); updateBadges();
  closeSpaceModal();
  toast(editId?'Space updated!':'Space created!','success');
};

function closeSpaceModal() { document.getElementById('space-modal').classList.add('hidden'); }

function deleteActiveSpace() {
  if (state.spaces.length <= 1) { toast('Cannot delete only space', 'error'); return; }
  const idx = state.spaces.findIndex(s=>s.id===state.activeSpace);
  if (!confirm(`Delete "${state.spaces[idx].name}" and all its items?`)) return;
  state.spaces.splice(idx,1);
  state.activeSpace = state.spaces[0].id;
  save(); updateSpaceList(); setWallpaper(); render(); updateBadges();
  toast('Space deleted','error');
}

/* ── EXPORT/IMPORT ───────────────────── */
function exportItems() {
  const blob=new Blob([JSON.stringify({version:2,spaces:state.spaces,activeSpace:state.activeSpace},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`sikpoket-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('Exported!','success');
}
function importFile(e) {
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=function(ev){try{const d=JSON.parse(ev.target.result);
  if(d.spaces){d.spaces.forEach(ns=>{const ex=state.spaces.find(s=>s.id===ns.id);if(ex){ex.items=[...ns.items,...ex.items];ex.name=ns.name||ex.name;ex.wallpaper=ns.wallpaper||ex.wallpaper;}else state.spaces.push(ns);});}
  else if(d.items||Array.isArray(d)){const s=getActiveSpace();if(s)s.items=[...(d.items||d),...s.items];}
  if(d.activeSpace)state.activeSpace=d.activeSpace;
  save();updateSpaceList();setWallpaper();render();updateBadges();toast('Imported!','success');}catch{toast('Invalid file','error');}};r.readAsText(f);e.target.value='';
}
function toast(m,t){const el=document.getElementById('toast');if(!el)return;el.textContent=m;el.className=`toast show ${t||''}`;clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* ── SEED ──────────────────────────── */
function seedDemo() {
  state.spaces = [
    {id:genId(),name:'Startups',wallpaper:'https://images.unsplash.com/photo-1559136555-9303baea8ebd?w=1200&q=80',items:[{id:genId(),type:'url',createdAt:Date.now()-432000000,title:'Raindrop.io',url:'https://raindrop.io',tags:['tools','productivity'],favorite:true,archived:false},{id:genId(),type:'url',createdAt:Date.now()-259200000,title:'MDN Web Docs',url:'https://developer.mozilla.org',tags:['dev','reference']},{id:genId(),type:'note',createdAt:Date.now()-86400000,title:'Q3 Review',content:'Key takeaways from the quarterly review — increase retention and ship by August.',tags:['work'],favorite:true}]},
    {id:genId(),name:'Research',wallpaper:'https://images.unsplash.com/photo-1507693769325-4b6d49b0ba76?w=1200&q=80',items:[{id:genId(),type:'url',createdAt:Date.now()-36000000,title:'arXiv: Machine Learning Papers',url:'https://arxiv.org/list/cs.LG/recent',tags:['papers','ai']},{id:genId(),type:'note',createdAt:Date.now()-7200000,title:'Research Ideas',content:'Explore transformer architectures for edge devices.',tags:['ideas','ai']},{id:genId(),type:'note',createdAt:Date.now()-21600000,title:'Competitor Analysis',content:'Notion, Obsidian, Raindrop — all solving the same problem from different angles.',tags:['competitive']}]},
    {id:genId(),name:'Personal',wallpaper:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80',items:[{id:genId(),type:'url',createdAt:Date.now()-60000,title:'Netflix',url:'https://netflix.com',tags:['entertainment']},{id:genId(),type:'password',createdAt:Date.now()-3600000,name:'GitHub',username:'sam@example.com',value:'my-secret-password-prod',tags:['dev']}]},
  ];
  state.activeSpace = state.spaces[0].id;
  save();
}

/* ── INIT ──────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  load();
  updateSpaceList();
  setWallpaper();
  document.querySelectorAll('.nav-item[data-collection]').forEach(b => b.addEventListener('click',()=>{state.collection=b.dataset.collection;state.tag=null;updateTagStrip();render();}));
  document.getElementById('global-search').addEventListener('input',e=>{state.search=e.target.value;render();});
  document.getElementById('sort-select').addEventListener('change',e=>{state.sort=e.target.value;render();});
  document.getElementById('view-grid').addEventListener('click',()=>{state.viewMode='grid';document.getElementById('view-grid').classList.add('active');document.getElementById('view-list').classList.remove('active');render();});
  document.getElementById('view-list').addEventListener('click',()=>{state.viewMode='list';document.getElementById('view-list').classList.add('active');document.getElementById('view-grid').classList.remove('active');render();});
  document.getElementById('topbar-add-btn').addEventListener('click',openAdd);
  document.getElementById('sidebar-toggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('collapsed'));
  document.querySelectorAll('.type-pill').forEach(p=>p.addEventListener('click',()=>{document.querySelectorAll('.type-pill').forEach(q=>q.classList.remove('active'));p.classList.add('active');document.getElementById('item-type').value=p.dataset.type;showTypeFields(p.dataset.type);}));
  document.getElementById('modal-close').addEventListener('click',closeModal);
  document.getElementById('modal-cancel').addEventListener('click',closeModal);
  document.getElementById('item-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
  document.getElementById('item-form').addEventListener('submit',handleFormSubmit);
  document.getElementById('export-btn').addEventListener('click',exportItems);
  document.getElementById('import-btn').addEventListener('click',()=>document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change',importFile);
  document.getElementById('tag-strip-clear').addEventListener('click',()=>{state.tag=null;updateTagStrip();render();});
  document.getElementById('add-space-btn').addEventListener('click', openAddSpace);
    document.getElementById('logout-btn')?.addEventListener('click', () => {
      sessionStorage.removeItem('sikpoket_user');
      window.location.href = 'auth.html';
    });
    document.getElementById('space-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSpaceModal();});
    document.addEventListener('keydown',e=>{
      if((e.key==='n'||e.key==='N')&&!e.ctrlKey&&!e.metaKey&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))openAdd();
      if(e.key==='Escape'){closeModal();closeSpaceModal();}
      if(e.key==='Delete'&&e.ctrlKey){e.preventDefault();deleteActiveSpace();}
  });
  if (!state.spaces.some(s => s.items?.length)) seedDemo();
  render(); updateBadges(); updateSidebarTags();
});
</script>
</body>
</html>
