<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SikPoket — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0b0a; --surface: #161210; --primary: #4a4f8a;
      --on-surface: #ede8e1; --on-variant: #9b9188; --muted: #5c5349;
      --outline: rgba(237,232,225,0.06);
      --font: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    }
    body {
      font-family: var(--font); background: var(--bg); color: var(--on-surface);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; -webkit-font-smoothing: antialiased;
      background: radial-gradient(ellipse at 50% 0%, #1a1208 0%, #0d0b0a 70%);
    }
    .login-card {
      width: 400px; background: var(--surface); border: 1px solid var(--outline);
      border-radius: 6px; padding: 40px 32px; text-align: center;
    }
    .login-icon { font-size: 40px; margin-bottom: 12px; }
    .login-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .login-sub { font-size: 13px; color: var(--on-variant); margin-bottom: 28px; }
    .tab-switch {
      display: flex; background: #0d0b0a; border: 1px solid var(--outline);
      border-radius: 4px; margin-bottom: 24px; overflow: hidden;
    }
    .tab-btn {
      flex: 1; padding: 10px; border: none; background: transparent;
      color: var(--on-variant); font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: var(--font); transition: all 0.15s;
    }
    .tab-btn.active { background: var(--primary); color: var(--on-surface); }
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label {
      display: block; font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
    }
    .form-group input {
      width: 100%; padding: 11px 14px; background: #0d0b0a;
      border: 1px solid var(--outline); border-radius: 5px;
      color: var(--on-surface); font-size: 14px; font-family: var(--font);
      transition: border-color 0.2s;
    }
    .form-group input:focus { outline: none; border-color: var(--primary); }
    .form-group input::placeholder { color: var(--muted); }
    .btn-primary {
      width: 100%; padding: 12px; margin-top: 8px;
      background: var(--primary); border: none; border-radius: 4px;
      color: var(--on-surface); font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: var(--font); transition: all 0.15s;
    }
    .btn-primary:hover { background: #3e4278; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: #8b3a2a; font-size: 12px; margin-top: 10px; min-height: 18px; }
    .success-msg { color: #5a7a5f; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h1 class="login-title">SikPoket</h1>
    <p class="login-sub">Your secure vault — login or create an account</p>

    <div class="tab-switch">
      <button class="tab-btn active" data-mode="login">Login</button>
      <button class="tab-btn" data-mode="register">Register</button>
    </div>

    <form id="auth-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="your-username" required autofocus>
      </div>
      <div class="form-group">
        <label>Master Password</label>
        <input type="password" id="password" placeholder="Your secret password" required>
      </div>
      <div class="form-group hidden" id="confirm-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Type it again">
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Login</button>
      <button type="button" class="btn-primary" id="guest-btn" style="margin-top:10px;background:var(--surface);border:1px solid var(--outline);color:var(--on-variant);">⚡ Quick Guest / Demo Vault</button>
      <div class="error-msg" id="msg"></div>
    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
