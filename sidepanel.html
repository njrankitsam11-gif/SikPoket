<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SikPoket Side Panel</title>
  <link rel="stylesheet" href="popup.css?v=1.6.2">
  <style>
    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: var(--c-base);
    }
    .sp-shell {
      width: 100%;
      height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
    }
    .sp-drop-zone {
      margin: 8px 12px;
      padding: 10px;
      border: 1.5px dashed rgba(144, 152, 212, 0.35);
      border-radius: 6px;
      background: rgba(144, 152, 212, 0.05);
      text-align: center;
      font-size: 11px;
      color: var(--c-txt2);
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .sp-drop-zone.dragover {
      border-color: var(--c-acc);
      background: rgba(144, 152, 212, 0.15);
      color: var(--c-txt);
      transform: scale(1.01);
    }
    .sp-tabs {
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sp-content {
      flex: 1;
      overflow-y: auto;
    }
    .sp-side-header-extra {
      display: flex;
      gap: 4px;
    }
  </style>
</head>
<body>
<div class="sp-shell">

  <!-- ══ UNLOCK SCREEN ════════════════════════ -->
  <div class="sp-lock-screen" id="unlock-overlay">
    <div class="sp-lock-card">
      <div class="sp-lock-glow"></div>
      <div class="sp-lock-icon">
        <svg viewBox="0 0 40 40" fill="none" width="40">
          <rect x="8" y="20" width="24" height="16" rx="4" fill="#6c63f5" opacity=".18"/>
          <rect x="8" y="20" width="24" height="16" rx="4" stroke="#6c63f5" stroke-width="1.5"/>
          <path d="M14 20v-5a6 6 0 1112 0v5" stroke="#6c63f5" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="20" cy="28" r="2" fill="#6c63f5"/>
        </svg>
      </div>
      <h1 class="sp-lock-title">SikPoket</h1>
      <p class="sp-lock-sub">Enter master password to unlock</p>
      <input type="password" id="unlock-input" class="sp-lock-input" placeholder="Master password" autofocus>
      <button id="unlock-btn" class="sp-lock-btn">Unlock Side Panel</button>
      <button id="biometric-unlock-btn" class="sp-lock-bio hidden">
        Touch ID / Biometrics
      </button>
    </div>
  </div>

  <!-- ══ HEADER ════════════════════════════════ -->
  <header class="sp-header">
    <div class="sp-header-row">
      <div class="sp-brand">
        <span class="sp-brand-dot"></span>
        <span class="sp-brand-name">SikPoket Side Panel</span>
      </div>
      <div class="sp-header-btns">
        <button class="sp-icon-btn" id="save-window-tabs-btn" title="Save All Open Tabs into a Session Snapshot">
          <svg viewBox="0 0 20 20" fill="none" width="15"><rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 3v14M3 8h14" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="sp-icon-btn" id="select-mode-btn" title="Select multiple items">
          <svg viewBox="0 0 20 20" fill="none" width="15"><rect x="3" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M11.5 14l1.5 1.5 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="sp-icon-btn" id="settings-btn" title="Settings">
          <svg viewBox="0 0 20 20" fill="none" width="15"><path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" stroke="currentColor" stroke-width="1.4"/><path d="M16.5 10c0-.34-.03-.67-.08-1l1.6-1.24a.5.5 0 00.12-.63l-1.52-2.63a.5.5 0 00-.61-.22l-1.89.76a7.4 7.4 0 00-1.72-1l-.28-2a.5.5 0 00-.5-.43h-3.04a.5.5 0 00-.5.43l-.28 2a7.4 7.4 0 00-1.72 1L4.1 4.28a.5.5 0 00-.61.22L1.97 7.13a.5.5 0 00.12.63L3.7 9c-.05.33-.08.66-.08 1s.03.67.08 1l-1.6 1.24a.5.5 0 00-.12.63l1.52 2.63c.12.21.37.3.6.22l1.9-.76c.52.39 1.1.72 1.72 1l.28 2c.05.24.27.43.5.43h3.04c.24 0 .45-.19.5-.43l.28-2a7.4 7.4 0 001.72-1l1.89.76c.23.08.48-.01.6-.22l1.52-2.63a.5.5 0 00-.12-.63L16.42 11c.05-.33.08-.66.08-1z" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="sp-icon-btn sp-lock-trigger" id="lock-btn" title="Lock Side Panel">
          <svg viewBox="0 0 20 20" fill="none" width="15"><rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 9V7a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- Drag & Drop Zone -->
    <div class="sp-drop-zone" id="sidepanel-drop-zone">
      <span>📥 Drop link, text, or tab here to save</span>
    </div>

    <!-- Search -->
    <div class="sp-search-wrap">
      <svg class="sp-search-icon" viewBox="0 0 18 18" fill="none" width="13">
        <circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M12.5 12.5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input type="text" id="search" class="sp-search" placeholder="Search vault or sessions…">
    </div>

    <!-- Filter pills -->
    <div class="sp-pills">
      <button class="sp-pill sp-pill-active" data-status="active">All</button>
      <button class="sp-pill" data-status="favorites">★ Favs</button>
      <button class="sp-pill" data-status="archived">↓ Archive</button>
      <div style="flex:1"></div>
      <button class="sp-pill sp-pill-sort" id="sort-btn" title="Sort: Newest">
        <svg viewBox="0 0 14 14" fill="none" width="12"><path d="M1 3h12M3 7h8M5 11h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>

    <select id="filter-status" class="sp-hidden"><option value="active">Active</option><option value="archived">Archive</option><option value="favorites">Favorites</option></select>
    <select id="filter-tag" class="sp-hidden"><option value="">All Tags</option></select>
    <select id="sort-order" class="sp-hidden"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="name">A–Z</option></select>
  </header>

  <!-- ══ TABS ══════════════════════════════════ -->
  <nav class="sp-tabs">
    <button class="sp-tab active" data-tab="urls">
      <svg viewBox="0 0 16 16" fill="none" width="12"><path d="M6 10l4-4M7.5 6l1-1a2.5 2.5 0 013.54 3.54l-1 1M8.5 10l-1 1a2.5 2.5 0 01-3.54-3.54l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>URLs</span>
      <span class="sp-badge" id="count-urls">0</span>
    </button>
    <button class="sp-tab" data-tab="sessions">
      <svg viewBox="0 0 16 16" fill="none" width="12"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M5 2v12M2 6h12" stroke="currentColor" stroke-width="1.3"/></svg>
      <span>Sessions</span>
      <span class="sp-badge" id="count-sessions">0</span>
    </button>
    <button class="sp-tab" data-tab="notes">
      <svg viewBox="0 0 16 16" fill="none" width="12"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3"/><path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Notes</span>
      <span class="sp-badge" id="count-notes">0</span>
    </button>
    <button class="sp-tab" data-tab="apiKeys">
      <svg viewBox="0 0 16 16" fill="none" width="12"><circle cx="6" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M9 8h5M12 6v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Keys</span>
      <span class="sp-badge" id="count-apiKeys">0</span>
    </button>
    <button class="sp-tab" data-tab="passwords">
      <svg viewBox="0 0 16 16" fill="none" width="12"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Pass</span>
      <span class="sp-badge" id="count-passwords">0</span>
    </button>
    <button class="sp-tab" data-tab="assistant">
      <svg viewBox="0 0 16 16" fill="none" width="12"><path d="M8 2a6 6 0 100 12A6 6 0 008 2zM6 7a1 1 0 110-2 1 1 0 010 2zm4 0a1 1 0 110-2 1 1 0 010 2zm-4.5 3a4 4 0 005 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Assistant</span>
    </button>
  </nav>

  <!-- ══ CONTENT ═══════════════════════════════ -->
  <main class="sp-content">
    <div class="sp-section active" id="urls-content">
      <div class="sp-quick-bar">
        <button class="sp-btn" id="add-url-btn">＋ Add URL</button>
        <button class="sp-btn sp-btn-secondary" id="save-current-tab-btn">⚡ Save Current Tab</button>
      </div>
      <div id="urls-list"></div>
    </div>

    <div class="sp-section" id="sessions-content">
      <div class="sp-quick-bar">
        <button class="sp-btn" id="snapshot-window-btn">📸 Snapshot Active Window</button>
      </div>
      <div id="sessions-list"></div>
    </div>

    <div class="sp-section" id="notes-content">
      <div class="sp-quick-bar">
        <button class="sp-btn" id="add-note-btn">＋ New Note</button>
      </div>
      <div id="notes-list"></div>
    </div>

    <div class="sp-section" id="apiKeys-content">
      <div class="sp-quick-bar">
        <button class="sp-btn" id="add-api-key-btn">＋ New API Key</button>
      </div>
      <div id="api-keys-list"></div>
    </div>

    <div class="sp-section" id="passwords-content">
      <div class="sp-quick-bar">
        <button class="sp-btn" id="add-password-btn">＋ New Password</button>
      </div>
      <div id="passwords-list"></div>
    </div>
    <div class="sp-section" id="assistant-content" style="display:flex;flex-direction:column;height:100%;">
      <div id="chat-messages" style="flex:1;overflow-y:auto;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:8px;">
        <div class="chat-msg" style="background:rgba(108,99,245,0.1);padding:8px 10px;border-radius:6px;color:var(--c-txt);">
          🤖 Hi! I'm your local AI Assistant. I can answer questions about your saved bookmarks and notes.
        </div>
      </div>
      <div class="chat-input-area" style="padding:10px;border-top:1px solid var(--c-border);display:flex;gap:6px;">
        <input type="text" id="chat-input" placeholder="Ask about your vault..." style="flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--c-border);border-radius:4px;padding:6px;color:var(--c-txt);font-family:inherit;">
        <button id="chat-send-btn" class="sp-btn" style="padding:6px 10px;">Send</button>
      </div>
    </div>
  </main>

  <!-- ══ FOOTER ════════════════════════════════ -->
  <footer class="sp-footer" style="padding:8px 12px;display:flex;justify-content:space-between;align-items:center;background:#0e0b0a;border-top:1px solid var(--c-border);">
    <button class="sp-guide-footer-btn" id="open-full-dashboard-btn">Open Full Dashboard ↗</button>
    <span style="font-size:10px;color:var(--c-txt2);">SikPoket v1.3</span>
  </footer>

</div>

<script src="crypto-helper.js"></script>
<script src="qr-helper.js"></script>
<script src="ai-helper.js"></script>
<script src="chat-helper.js"></script>
<script src="popup.js"></script>
</body>
</html>
